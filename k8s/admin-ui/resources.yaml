apiVersion: apps/v1
kind: Deployment
metadata: { name: admin-ui, namespace: bit }
spec:
  replicas: 2
  selector: { matchLabels: { app: admin-ui } }
  template:
    metadata: { labels: { app: admin-ui } }
    spec:
      containers:
        - name: admin-ui
          image: elroymalayov/bit-admin-ui:03
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: admin-ui, namespace: bit }
spec:
  selector: { app: admin-ui }
  ports: [{ port: 80, targetPort: 80 }]
