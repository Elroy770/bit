apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bit
  namespace: bit
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 5m
spec:
  ingressClassName: nginx
  rules:
  - host: bit.example.com # Replace only after choosing the real domain
    http:
      paths:
      - path: /cashier
        pathType: Prefix
        backend: {service: {name: cashier-ui, port: {number: 80}}}
      - path: /admin
        pathType: Prefix
        backend: {service: {name: admin-ui, port: {number: 80}}}
      - path: /api
        pathType: Prefix
        backend: {service: {name: backend, port: {number: 8000}}}
