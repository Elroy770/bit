apiVersion: v1
kind: ConfigMap
metadata: {name: bit-backend-config, namespace: bit}
data:
  RECEIPTS_DIR: /data/receipts
  AUTH_MODE: proxy
  CORS_ORIGINS: https://bit.elroy.site
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: bit}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
      - name: backend
        image: bit-backend:local
        imagePullPolicy: Never
        envFrom: [{configMapRef: {name: bit-backend-config}}]
        env:
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: bit-postgres, key: DATABASE_URL}}
        ports: [{containerPort: 8000}]
        readinessProbe: {httpGet: {path: /api/health, port: 8000}}
        volumeMounts:
        - {name: receipts, mountPath: /data/receipts}
      volumes:
      - {name: receipts, persistentVolumeClaim: {claimName: receipts-data}}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: bit}
spec:
  selector: {app: backend}
  ports: [{port: 8000, targetPort: 8000}]
