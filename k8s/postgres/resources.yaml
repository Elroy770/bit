apiVersion: v1
kind: Secret
metadata: {name: bit-postgres, namespace: bit}
type: Opaque
stringData:
  POSTGRES_DB: bit
  POSTGRES_USER: bit
  POSTGRES_PASSWORD: REPLACE_OUT_OF_BAND
  DATABASE_URL: postgresql+psycopg://bit:REPLACE_OUT_OF_BAND@postgres:5432/bit
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: bit}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: bit}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        envFrom: [{secretRef: {name: bit-postgres}}]
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: bit}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
