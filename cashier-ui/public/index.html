<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bit — קופה</title><link rel="stylesheet" href="style.css"></head><body><main><section id="login-panel"><h1>כניסה לקופה</h1><form id="login-form"><label>שם משתמש<input name="username" value="cashier" autocomplete="username" required></label><label>סיסמה<input name="password" type="password" autocomplete="current-password" required></label><label><input name="remember" type="checkbox" checked> זכור את מחשב הקופה</label><button>התחבר</button></form><p id="login-message" role="alert"></p></section><section id="app-content" hidden><h1>שמירת עסקה</h1><p>הזן את פרטי התשלום ושמור.</p><form id="form"><label>שם<input name="name" required autofocus></label><label>מספר טלפון<input name="phone" inputmode="tel" required></label><label>סכום<input name="amount" type="number" min="0.01" step="0.01" required></label><label>שולם עכשיו<input name="paid_amount" type="number" min="0" step="0.01" value="0"></label><label>הערה<textarea name="note"></textarea></label><label>צילום קבלה<input name="receipt" type="file" accept="image/jpeg,image/png,image/webp"></label><button>שמור עסקה</button></form><p id="message" role="status"></p><button id="logout">התנתק</button><p><a href="/admin/">כניסה לניהול</a></p></section></main><script src="app.js"></script></body></html>
